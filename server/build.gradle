apply plugin: 'com.android.application'

android {
    namespace = 'com.genymobile.scrcpy'
    compileSdk 36
    defaultConfig {
        applicationId = "com.genymobile.scrcpy"
        minSdkVersion 21
        targetSdkVersion 36
        versionCode 30304
        versionName "3.3.4"
        testInstrumentationRunner = "android.support.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        buildConfig = true
        aidl = true
    }
    lint {
        disable 'UseRequiresApi'
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}

apply from: "$project.rootDir/config/android-checkstyle.gradle"

// 编译完成后自动复制 APK 到客户端 env 目录 (重命名为 scrcpy-server)
android.applicationVariants.configureEach { variant ->
    if (variant.buildType.name == 'release') {
        variant.assembleProvider.configure {
            doLast {
                def src = variant.outputs.first().outputFile
                def dst = file("${project.rootDir}/client/env/scrcpy-server")
                copy {
                    from src
                    into dst.parentFile
                    rename { 'scrcpy-server' }
                }
                println "[auto-copy] ${src.name} -> ${dst}"
            }
        }
    }
}
